
name: Build Bluetooth Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip BluetoothChat-Android-Phone-Build.zip

      - name: Build APK
        run: gradle -p BluetoothChat assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothChat-APK
          path: BluetoothChat/app/build/outputs/apk/debug/app-debug.apk
